
spring:
  application:
    name: sentinel

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/sentinel}
      database: sentinel

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: ${PORT:8080}

sentinel:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  ml:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    mode: ${ML_MODE:RULES_ONLY} # RULES_ONLY, ML_ONLY, HYBRID

  admin:
    username: ${SENTINEL_ADMIN_USERNAME:admin}
    password: ${SENTINEL_ADMIN_PASSWORD:admin123}

  jwt:
    secret: ${JWT_SECRET:change_this_secret_to_32_chars_123456}
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.sentinel: DEBUG
